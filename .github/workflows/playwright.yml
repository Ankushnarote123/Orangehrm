name: Playwright Tests

on:
  # Every push, to any branch.
  push:
    branches: ['**']
  # Pull requests into main are tested too (also covers PRs from forks).
  pull_request:
    branches: [main]
  # Manual runs from the Actions tab.
  workflow_dispatch:

# Least privilege: the job only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # Let every browser finish so one failure doesn't hide the others' results.
      fail-fast: false
      matrix:
        include:
          # `browser` is what to install. api and security still need Chromium for the login setup.
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: api, browser: chromium }
          - { project: security, browser: chromium }
    env:
      CI: 'true'
      # Optional overrides. Without them the suite targets the public demo with its
      # published demo credentials, so no secret is required. Secrets are not passed
      # to workflows triggered from forks, and Actions masks them in logs.
      BASE_URL: ${{ vars.BASE_URL }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      # Optional Slack/Teams incoming-webhook URL: FailureAlertReporter posts there when tests fail.
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Install Playwright browser and OS dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }}

      # Artifact names include the browser so matrix jobs never overwrite each other.
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.project }}
          path: test-results/junit.xml
          retention-days: 14

      - name: Upload failure diagnostics (traces, screenshots, videos)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: |
            test-results/
            !test-results/junit.xml
          if-no-files-found: ignore
          retention-days: 7

      # Allure report for this project (one self-contained index.html), built by AllureReportGenerator.
      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.project }}
          path: allure-report/
          if-no-files-found: ignore
          retention-days: 14

      # Raw Allure results, merged into one report by the allure-combined job below.
      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 7

  # One Allure report with the pass/fail results of every project, even when some jobs failed.
  allure-combined:
    name: Allure report (all projects)
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Download every project's Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: all-allure-results

      - name: Generate the combined Allure report
        run: |
          if [ -z "$(ls -A all-allure-results 2>/dev/null)" ]; then
            echo "No Allure results were produced." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          npx allure generate all-allure-results/* --config allurerc.mjs
          node -e "const s=require('./allure-report/summary.json').stats; console.log('### Allure: ' + Object.entries(s).map(([k,v]) => k + ' ' + v).join(' | '))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the combined Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-combined
          path: allure-report/
          if-no-files-found: ignore
          retention-days: 30
